<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music</title>

    <style>
        body {
            margin: 0;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        img {
            max-width: 100%;
            height: auto;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <img src="cover.jpg" onclick="playMusic()">

    <audio id="music">
        <source src="music.m4a" type="audio/mp4">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script>
        function playMusic() {
            const music = document.getElementById("music");
            music.play();
        }
    </script>

</body>
</html>
